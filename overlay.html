<!DOCTYPE html>
<!--
  DA Timer - video overlay (lower third)

  Add as a browser source in OBS / vMix / Wirecast / CasparCG:
      http://127.0.0.1:47800/overlay            (on the DA Timer PC)
      http://<DA Timer PC>:47800/overlay?key=... (another PC - turn on
                                                 Settings -> Video overlay
                                                 on other computers, and
                                                 copy the address DA Timer
                                                 shows, key included)
  Size the source 1920x1080 (any 16:9 size works). The background is
  transparent. What shows, sizes, colours, logo and position are set in
  DA Timer: Output to monitor > Design video overlay. Changes appear live.

  Optional settings on the end of the address override DA Timer's, e.g.
  /overlay?pos=top&bg=0.6
      pos=top|bottom  bar position
      bg=0.0-1.0      background opacity
      scale=0.8       whole bar smaller / bigger
      items=...       title,line,name,seg,status,prog,tod,msg
      safe=0|1        title-safe margin off / on
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DA Timer overlay</title>
<link rel="icon" href="data:,">
<style>
  :root { --u: 1px; --accent: #00e5f0; --fg: #ffffff;
          --barbg: rgba(9, 12, 17, .78); --side: 96; --edge: 54;
          --ft: "DA Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
          --fts: "DA Sans SemiBold", "DA Sans", "Segoe UI", Arial, sans-serif;
          --ftb: "DA Sans Bold", "DA Sans", "Segoe UI", Arial, sans-serif;
          --fc: "DA Clock", "DA Sans", "Segoe UI", Arial, sans-serif; }
  html, body { margin: 0; height: 100%; background: transparent;
               overflow: hidden; }
  body { font-family: var(--ft); color: var(--fg);
         -webkit-font-smoothing: antialiased; }
  #frame { position: absolute; inset: 0; margin: auto;
           width: min(100vw, 177.7778vh); height: min(56.25vw, 100vh); }
  #wrap { position: absolute; left: calc(var(--side) * var(--u));
          right: calc(var(--side) * var(--u));
          bottom: calc(var(--edge) * var(--u));
          display: flex; flex-direction: column; align-items: stretch;
          gap: calc(10 * var(--u)); transform-origin: 50% 100%;
          transform: scale(var(--scale, 1)); transition: opacity .4s ease; }
  #wrap.top { bottom: auto; top: calc(var(--edge) * var(--u));
              flex-direction: column-reverse; transform-origin: 50% 0; }
  #wrap.al-left { align-items: flex-start; transform-origin: 0 100%; }
  #wrap.al-right { align-items: flex-end; transform-origin: 100% 100%; }
  #wrap.al-center { align-items: center; }
  #wrap.top.al-left { transform-origin: 0 0; }
  #wrap.top.al-right { transform-origin: 100% 0; }
  #wrap.hidden { opacity: 0; }

  #bar { display: flex; align-items: stretch; max-width: 100%;
         min-height: calc(110 * var(--u)); background: var(--barbg);
         border-radius: calc(16 * var(--u)); overflow: hidden;
         position: relative; }
  #bar.shadow { box-shadow: 0 calc(6 * var(--u)) calc(30 * var(--u))
                            rgba(0, 0, 0, .35); }
  #bar::before { content: ""; position: absolute; left: 0; top: 0;
                 bottom: 0; width: calc(8 * var(--u));
                 background: var(--accent); transition: background .3s; }
  #bar.running::before { background: #2bd47d; }
  #bar.over::before { background: #ff4757; }
  .blk { display: flex; flex-direction: column; justify-content: flex-start;
         padding: calc(16 * var(--u)) calc(34 * var(--u)); min-width: 0; }
  .blk.first { padding-left: calc(46 * var(--u)); }
  .blk.sep { border-left: calc(2 * var(--u)) solid rgba(255,255,255,.12); }
  .hide { display: none !important; }
  #b-info { justify-content: center; }
  #wrap.al-full #b-info { flex: 1 1 auto; }
  #b-logo { justify-content: center; align-items: center;
            padding-right: calc(10 * var(--u)); }
  #logo { display: block; height: calc(var(--logo, 84) * var(--u));
          width: auto; max-width: calc(420 * var(--u)); object-fit: contain; }
  .cap { font-family: var(--fts); font-weight: 600; text-transform: uppercase;
         letter-spacing: .06em; color: var(--accent);
         font-size: calc(var(--fs, 24) * var(--u)); line-height: 1.15;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name { font-family: var(--ftb); font-weight: 700;
          font-size: calc(var(--fs, 46) * var(--u)); line-height: 1.1;
          margin-top: calc(4 * var(--u)); white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis; }
  .title { font-size: calc(var(--fs, 20) * var(--u)); opacity: .8;
           letter-spacing: .04em; text-transform: uppercase;
           margin-bottom: calc(4 * var(--u)); white-space: nowrap;
           overflow: hidden; text-overflow: ellipsis; }
  .dig { font-family: var(--fc); font-variant-numeric: tabular-nums;
         white-space: nowrap; font-size: calc(var(--fs, 84) * var(--u));
         line-height: 1; margin-top: calc(4 * var(--u));
         transition: color .25s; }
  .status { font-family: var(--fts); font-weight: 600;
            font-size: calc(var(--fs, 24) * var(--u)); letter-spacing: .04em;
            margin-top: calc(6 * var(--u)); white-space: nowrap;
            transition: color .25s; }
  .status:empty { display: none; }
  #msg { max-width: 100%; background: var(--barbg);
         border-radius: calc(12 * var(--u));
         padding: calc(10 * var(--u)) calc(30 * var(--u));
         font-family: var(--fts); font-weight: 600;
         font-size: calc(var(--fs, 30) * var(--u)); letter-spacing: .04em;
         text-transform: uppercase;
         border-bottom: calc(3 * var(--u)) solid var(--accent);
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #wrap.al-full #msg { align-self: center; }
  #cue { align-self: center; max-width: 100%;
         border-radius: calc(14 * var(--u));
         padding: calc(14 * var(--u)) calc(40 * var(--u));
         font-family: var(--ftb); font-weight: 700;
         font-size: calc(52 * var(--u)); letter-spacing: .04em;
         line-height: 1.1; white-space: nowrap; overflow: hidden;
         text-overflow: ellipsis; color: #000; background: #ffb547;
         box-shadow: 0 calc(6 * var(--u)) calc(30 * var(--u))
                     rgba(0, 0, 0, .35); }
  #cue.flash { animation: cueflash 1s steps(1, end) infinite; }
  @keyframes cueflash { 50% { background: rgba(9, 12, 17, .9);
                              color: var(--cue); } }
  #debug { position: absolute; left: 8px; top: 8px; font: 14px monospace;
           color: #ff4757; background: rgba(0,0,0,.6); padding: 4px 8px;
           display: none; }
</style>
</head>
<body>
<div id="frame">
  <div id="wrap" class="hidden al-full">
    <div id="cue" class="hide"></div>
    <div id="msg" class="hide"></div>
    <div id="bar" class="shadow">
      <div class="blk" id="b-logo"><img id="logo" alt=""></div>
      <div class="blk" id="b-info">
        <div class="title" id="title"></div>
        <div class="cap" id="line"></div>
        <div class="name" id="name"></div>
      </div>
      <div class="blk" id="b-seg">
        <div class="cap" id="seg-cap">Segment</div>
        <div class="dig" id="seg"></div>
        <div class="status" id="status"></div>
      </div>
      <div class="blk" id="b-prog">
        <div class="cap" id="prog-cap">Program</div>
        <div class="dig" id="prog"></div>
      </div>
      <div class="blk" id="b-tod">
        <div class="cap" id="tod-cap">Time of day</div>
        <div class="dig" id="tod"></div>
      </div>
    </div>
  </div>
  <div id="debug"></div>
</div>

<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  var base = "";                       // always served by DA Timer itself
  var KEY = q.get("key") ? "key=" + encodeURIComponent(q.get("key")) : "";
  function withKey(url) {
    return KEY ? url + (url.indexOf("?") < 0 ? "?" : "&") + KEY : url;
  }
  var URL_ITEMS = q.get("items") ? q.get("items").split(",") : null;
  var ALIAS = { title: "title", line: "seg_line", name: "seg_name",
                seg: "seg", status: "status", prog: "prog", tod: "tod",
                msg: "message" };
  var debug = q.has("debug");
  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement.style;
  var wrap = $("wrap"), bar = $("bar");

  // bundled fonts straight from DA Timer, so the overlay matches the app
  [["DA Clock", "DAClock.ttf", 400], ["DA Sans", "DASans.ttf", 400],
   ["DA Sans SemiBold", "DASans-SemiBold.ttf", 600],
   ["DA Sans Bold", "DASans-Bold.ttf", 700]].forEach(function (f) {
    try {
      var face = new FontFace(f[0], "url(" + withKey(base + "/fonts/" + f[1]) + ")",
                              { weight: String(f[2]) });
      face.load().then(function (l) { document.fonts.add(l); },
                       function () {});
    } catch (e) {}
  });

  // 1920x1080 design units -> real pixels of the 16:9 frame
  function fit() {
    var w = $("frame").getBoundingClientRect().width || 1920;
    root.setProperty("--u", (w / 1920) + "px");
  }
  window.addEventListener("resize", fit);
  fit();

  // ---------------------------------------------------------------- data
  var S = null, got = 0, okAt = 0, polling = false, fails = 0;
  // One poll at a time, each with a deadline, so a stalled request can
  // never stop the overlay from trying again (backs off if DA Timer is
  // away, back to every 120 ms as soon as it answers).
  function poll() {
    if (polling) return;
    polling = true;
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 1500);
    fetch(withKey(base + "/api/state"),
          { cache: "no-store", signal: ctl ? ctl.signal : undefined })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (j) {
        if (j && j.live) { S = j; got = performance.now(); okAt = got; }
        fails = 0;
      })
      .catch(function () { fails = Math.min(fails + 1, 5); })
      .then(function () {
        clearTimeout(timer);
        polling = false;
        setTimeout(poll, fails ? 250 * Math.pow(2, fails - 1) : 120);
      });
  }
  poll();

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function hms(t) {
    t = Math.max(0, Math.floor(t));
    return pad(Math.floor(t / 3600)) + ":" + pad(Math.floor(t % 3600 / 60)) +
           ":" + pad(t % 60);
  }
  // same rule as the app: whole seconds, fraction dropped (2.5 -> 00:02)
  function short(t) {
    t = Math.floor(Math.abs(t));
    if (t >= 3600) return Math.floor(t / 3600) + ":" +
                          pad(Math.floor(t % 3600 / 60)) + ":" + pad(t % 60);
    return pad(Math.floor(t / 60)) + ":" + pad(t % 60);
  }
  function rgba(hex, a) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || "");
    if (!m) return "rgba(9,12,17," + a + ")";
    return "rgba(" + parseInt(m[1], 16) + "," + parseInt(m[2], 16) + "," +
           parseInt(m[3], 16) + "," + a + ")";
  }
  function fam(name, fallback) {
    return name ? '"' + name.replace(/"/g, "") + '", ' + fallback : fallback;
  }
  var last = {};
  function set(id, prop, val) {
    var k = id + "." + prop;
    if (last[k] === val) return;
    last[k] = val;
    var el = $(id);
    if (prop === "text") el.textContent = val;
    else if (prop === "color") el.style.color = val;
    else if (prop === "hide") el.classList.toggle("hide", !!val);
    else if (prop === "fs") el.style.setProperty("--fs", val);
    else if (prop === "src") { if (val) el.src = withKey(base + val); }
  }
  function css(name, val) {
    if (last["css" + name] === val) return;
    last["css" + name] = val;
    root.setProperty(name, val);
  }
  function cls(el, name, on) {
    if (el.classList.contains(name) !== !!on) el.classList.toggle(name, !!on);
  }

  // --------------------------------------------------------------- frame
  function frame() {
    requestAnimationFrame(frame);
    var now = performance.now();
    if (debug) {
      $("debug").style.display = "block";
      $("debug").textContent = S ? "DA Timer " + S.version + "  " +
          Math.round(now - okAt) + " ms since data" :
          "Waiting for DA Timer at " + (base || location.host);
    }
    cls(wrap, "hidden", !S || now - okAt > 3000);
    if (!S || !S.overlay || !S.overlay.cfg) return;
    var L = S.live, O = S.overlay, cfg = O.cfg, it = cfg.items || {};
    var dt = (now - got) / 1000;
    var seg = L.seg + (L.seg_running ? dt : 0);
    var prog = L.prog + (L.prog_running ? dt : 0);
    var C = O.colours || { ok: "#2bd47d", warn: "#ffb547", over: "#ff4757" };
    var NS = !!S.noshow;            // "No show": time of day only
    function on(id) {
      if (NS) return id === "tod";
      if (URL_ITEMS) return URL_ITEMS.some(function (k) {
        return ALIAS[k] === id; });
      return !!(it[id] && it[id].show);
    }
    function size(id, px) {
      var s = (it[id] && it[id].size) || 1;
      return String(Math.round(px * Math.min(Math.max(s, 0.4), 3) * 10) / 10);
    }
    function col(id, dflt) { return (it[id] && it[id].colour) || dflt; }

    // ---- look
    var pos = q.get("pos") || cfg.position || "bottom";
    cls(wrap, "top", pos === "top");
    var al = cfg.align || "full";
    ["full", "left", "center", "right"].forEach(function (a) {
      cls(wrap, "al-" + a, a === al); });
    var safe = q.has("safe") ? q.get("safe") !== "0" : cfg.safe !== false;
    css("--side", safe ? "96" : "24");
    css("--edge", safe ? "54" : "20");
    css("--scale", q.get("scale") || String(cfg.scale || 1));
    var op = q.has("bg") ? parseFloat(q.get("bg")) :
        (cfg.opacity == null ? 0.78 : cfg.opacity);
    css("--barbg", rgba(cfg.bg || "#090c11", op));
    cls(bar, "shadow", op > 0.05);
    css("--accent", O.accent || "#00e5f0");
    css("--fg", O.fg || "#ffffff");
    var F = O.fonts || {};
    css("--ft", fam(F.font_text, '"DA Sans", "Segoe UI", Arial, sans-serif'));
    css("--fts", fam(F.font_text,
        '"DA Sans SemiBold", "DA Sans", "Segoe UI", Arial, sans-serif'));
    css("--ftb", fam(F.font_text,
        '"DA Sans Bold", "DA Sans", "Segoe UI", Arial, sans-serif'));
    css("--fc", fam(F.font_clock,
        '"DA Clock", "DA Sans", "Segoe UI", Arial, sans-serif'));

    // ---- block order (logo always first)
    var order = (cfg.order || ["info", "seg", "prog", "tod"]).join(",");
    if (last.order !== order) {
      last.order = order;
      order.split(",").forEach(function (b) {
        var el = $("b-" + b); if (el) bar.appendChild(el); });
    }

    // ---- logo
    set("b-logo", "hide", !O.logo || NS);
    set("logo", "src", O.logo || "");
    $("logo").style.setProperty("--logo",
        String(84 * Math.min(Math.max(cfg.logo_size || 1, 0.3), 3)));

    // ---- name / segment line
    var showInfo = on("title") || on("seg_line") || on("seg_name");
    set("b-info", "hide", !showInfo);
    set("title", "hide", !on("title") || !O.title);
    set("title", "text", O.title || "");
    set("title", "fs", size("title", 20));
    set("title", "color", col("title", O.fg));
    set("line", "hide", !on("seg_line"));
    set("line", "text", O.seg_caption || "");
    set("line", "fs", size("seg_line", 24));
    set("line", "color", col("seg_line", "var(--accent)"));
    set("name", "hide", !on("seg_name") || !O.seg_name);
    set("name", "text", O.seg_name || "");
    set("name", "fs", size("seg_name", 46));
    set("name", "color", col("seg_name", O.fg));

    // ---- segment clock + time left / over
    var goal = O.goal || 0, si = it.seg || {};
    set("b-seg", "hide", !on("seg") && !on("status"));
    set("seg", "hide", !on("seg"));
    set("seg-cap", "text", on("seg_line") && showInfo ? (O.seg_label ||
        "Segment") : (O.seg_caption || "Segment"));
    var segTxt = hms(seg), segCol = col("seg", O.fg), over = false;
    if (si.count === "down" && goal) {
      var left = goal - Math.floor(seg);
      if (left >= 0) { segTxt = hms(left); if (left <= 15) segCol = C.warn; }
      else { segTxt = "+" + hms(-left); segCol = C.over; over = true; }
    }
    set("seg", "text", segTxt);
    set("seg", "color", segCol);
    set("seg", "fs", size("seg", 84));
    var st = "", stCol = "";
    if (on("status") && goal) {
      var d = Math.floor(seg) - goal;
      if (d > 0) { st = "+" + short(d) + " over"; stCol = C.over; over = true; }
      else if (d === 0) { st = "On goal"; stCol = C.warn; }
      else { st = short(-d) + " left"; stCol = -d <= 15 ? C.warn : C.ok; }
      stCol = col("status", stCol);
    }
    set("status", "text", st);
    set("status", "color", stCol);
    set("status", "fs", size("status", 24));

    // ---- program clock
    set("b-prog", "hide", !on("prog"));
    set("prog-cap", "text", O.show_label || "Program");
    set("prog", "text", hms(prog));
    set("prog", "color", col("prog", O.fg));
    set("prog", "fs", size("prog", 84));

    // ---- time of day / timecode
    var ti = it.tod || {};
    set("b-tod", "hide", !on("tod"));
    if (ti.mode === "tc" && L.tc && !NS) {
      set("tod-cap", "text", "Timecode"); set("tod", "text", L.tc);
    } else {
      set("tod-cap", "text", "Time of day");
      set("tod", "text", hms((L.tod + dt) % 86400));
    }
    set("tod", "color", col("tod", O.fg));
    set("tod", "fs", size("tod", 84));

    // ---- separators and first-block padding follow what's visible
    var vis = Array.prototype.filter.call(bar.children, function (el) {
      return !el.classList.contains("hide"); });
    vis.forEach(function (el, i) {
      cls(el, "first", i === 0);
      cls(el, "sep", i > 0 && vis[i - 1].id !== "b-logo");
    });
    set("bar", "hide", vis.length === 0);

    // ---- bottom message strip
    var msg = on("message") ? O.message || "" : "";
    set("msg", "text", msg);
    set("msg", "hide", !msg);
    set("msg", "fs", size("message", 30));
    set("msg", "color", col("message", O.fg));

    // ---- talent message (when sent to the overlay)
    var M = S.message;
    var cueOn = !!(M && M.overlay && M.text);
    set("cue", "hide", !cueOn);
    if (cueOn) {
      set("cue", "text", M.text);
      var cueEl = $("cue");
      if (last.cueBg !== M.colour) {
        last.cueBg = M.colour;
        cueEl.style.background = M.colour;
        cueEl.style.setProperty("--cue", M.colour);
        var m = /^#?(..)(..)(..)$/.exec(M.colour) || [0, "ff", "b5", "47"];
        var lum = (parseInt(m[1], 16) * 299 + parseInt(m[2], 16) * 587 +
                   parseInt(m[3], 16) * 114) / 1000;
        cueEl.style.color = lum > 140 ? "#000" : "#fff";
      }
      cls(cueEl, "flash", !!M.flash);
    }

    cls(bar, "running", !!L.seg_running && !over && !NS);
    cls(bar, "over", over);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
