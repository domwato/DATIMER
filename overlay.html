<!DOCTYPE html>
<!--
  DA Timer - video overlay (lower third)

  Add as a browser source in OBS / vMix / Wirecast / CasparCG:
      http://127.0.0.1:47800/overlay            (on the DA Timer PC)
      http://<DA Timer PC>:47800/overlay        (another PC - turn on
                                                 Settings -> Video overlay
                                                 on other computers)
  Size the source 1920x1080 (any 16:9 size works). The background is
  transparent; the timing bar sits along the bottom of the frame.

  Optional settings on the end of the address, e.g. /overlay?pos=top&bg=0.6
      host=IP:47800   where DA Timer is (only needed for a saved copy)
      pos=top         put the bar at the top instead of the bottom
      bg=0.0-1.0      bar background opacity (default 0.78)
      scale=0.8       make the whole bar smaller / bigger
      items=...       choose what shows instead of the show's output layout:
                      name, seg, status, prog, tod, msg   e.g. items=seg,prog
      safe=0          ignore the 5% title-safe margin
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DA Timer overlay</title>
<link rel="icon" href="data:,">
<style>
  :root { --u: 1px; --accent: #00e5f0; --fg: #ffffff; --bg-a: 0.78; }
  html, body { margin: 0; height: 100%; background: transparent;
               overflow: hidden; }
  body { font-family: "DA Sans", "Segoe UI", "Helvetica Neue", Arial,
         sans-serif; color: var(--fg);
         -webkit-font-smoothing: antialiased; }
  /* the 16:9 picture, letterboxed inside whatever size the source is */
  #frame { position: absolute; inset: 0; margin: auto;
           width: min(100vw, 177.7778vh); height: min(56.25vw, 100vh); }
  #wrap { position: absolute; left: calc(var(--side) * var(--u));
          right: calc(var(--side) * var(--u));
          bottom: calc(var(--edge) * var(--u));
          display: flex; flex-direction: column; align-items: stretch;
          gap: calc(10 * var(--u));
          transform-origin: 50% 100%; transform: scale(var(--scale, 1));
          transition: opacity .4s ease; }
  #wrap.top { bottom: auto; top: calc(var(--edge) * var(--u));
              flex-direction: column-reverse; transform-origin: 50% 0; }
  #wrap.hidden { opacity: 0; }

  #bar { display: flex; align-items: stretch; min-height: calc(132 * var(--u));
         background: rgba(9, 12, 17, var(--bg-a));
         border-radius: calc(16 * var(--u)); overflow: hidden;
         box-shadow: 0 calc(6 * var(--u)) calc(30 * var(--u)) rgba(0,0,0,.35);
         position: relative; }
  #bar::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0;
                 width: calc(8 * var(--u)); background: var(--accent);
                 transition: background .3s; }
  #bar.running::before { background: #2bd47d; }
  #bar.over::before { background: #ff4757; }
  #bar.compact { align-self: center; max-width: 100%; }
  .blk { display: flex; flex-direction: column; justify-content: flex-start;
         padding: calc(16 * var(--u)) calc(34 * var(--u)); min-width: 0; }
  .blk + .blk { border-left: calc(2 * var(--u)) solid rgba(255,255,255,.12); }
  .blk.hide { display: none; }
  #b-name { flex: 1 1 auto; padding-left: calc(46 * var(--u));
            justify-content: center; }
  #b-name + .blk:not(.hide), #bar.compact .blk:first-child:not(.hide) { }
  #bar.compact .blk:not(.hide) { padding-left: calc(40 * var(--u)); }
  .cap { font-family: "DA Sans SemiBold", "DA Sans", "Segoe UI", Arial,
         sans-serif; font-weight: 600; text-transform: uppercase;
         letter-spacing: .06em; color: var(--accent);
         font-size: calc(24 * var(--u)); line-height: 1.15;
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name { font-family: "DA Sans Bold", "DA Sans", "Segoe UI", Arial,
          sans-serif; font-weight: 700; font-size: calc(46 * var(--u));
          line-height: 1.1; margin-top: calc(4 * var(--u));
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title { font-size: calc(20 * var(--u)); opacity: .75;
           letter-spacing: .04em; text-transform: uppercase;
           margin-bottom: calc(4 * var(--u)); white-space: nowrap;
           overflow: hidden; text-overflow: ellipsis; }
  .dig { font-family: "DA Clock", "DA Sans", "Segoe UI", Arial, sans-serif;
         font-variant-numeric: tabular-nums; white-space: nowrap;
         font-size: calc(var(--fs, 84) * var(--u)); line-height: 1;
         margin-top: calc(4 * var(--u)); transition: color .25s; }
  .status { font-family: "DA Sans SemiBold", "DA Sans", Arial, sans-serif;
            font-weight: 600; font-size: calc(24 * var(--u));
            letter-spacing: .04em; margin-top: calc(6 * var(--u));
            white-space: nowrap; transition: color .25s; }
  .status:empty { display: none; }
  #msg { align-self: center; max-width: 100%;
         background: rgba(9, 12, 17, var(--bg-a));
         border-radius: calc(12 * var(--u));
         padding: calc(10 * var(--u)) calc(30 * var(--u));
         font-family: "DA Sans SemiBold", "DA Sans", Arial, sans-serif;
         font-weight: 600; font-size: calc(30 * var(--u));
         letter-spacing: .04em; text-transform: uppercase;
         border-bottom: calc(3 * var(--u)) solid var(--accent);
         white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #msg.hide { display: none; }
  #debug { position: absolute; left: 8px; top: 8px; font: 14px monospace;
           color: #ff4757; background: rgba(0,0,0,.6); padding: 4px 8px;
           display: none; }
</style>
</head>
<body>
<div id="frame">
  <div id="wrap" class="hidden">
    <div id="msg" class="hide"></div>
    <div id="bar">
      <div class="blk" id="b-name">
        <div class="title" id="title"></div>
        <div class="cap" id="seg-cap">Segment</div>
        <div class="name" id="seg-name"></div>
      </div>
      <div class="blk" id="b-seg">
        <div class="cap" id="seg-clock-cap">Segment</div>
        <div class="dig" id="seg"></div>
        <div class="status" id="status"></div>
      </div>
      <div class="blk" id="b-prog">
        <div class="cap" id="prog-cap">Program</div>
        <div class="dig" id="prog"></div>
      </div>
      <div class="blk" id="b-tod">
        <div class="cap" id="tod-cap">Time of day</div>
        <div class="dig" id="tod"></div>
      </div>
    </div>
  </div>
  <div id="debug"></div>
</div>

<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  var host = q.get("host") ||
      (location.protocol === "file:" ? "127.0.0.1:47800" : "");
  var base = host ? "http://" + host : "";
  var forced = q.get("items") ? q.get("items").split(",") : null;
  var debug = q.has("debug");
  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement.style;
  var wrap = $("wrap"), bar = $("bar");

  // bundled fonts straight from DA Timer, so the overlay matches the app
  [["DA Clock", "DAClock.ttf", 400], ["DA Sans", "DASans.ttf", 400],
   ["DA Sans SemiBold", "DASans-SemiBold.ttf", 600],
   ["DA Sans Bold", "DASans-Bold.ttf", 700]].forEach(function (f) {
    try {
      var face = new FontFace(f[0], "url(" + base + "/fonts/" + f[1] + ")",
                              { weight: String(f[2]) });
      face.load().then(function (l) { document.fonts.add(l); },
                       function () {});
    } catch (e) {}
  });

  if (q.get("pos") === "top") wrap.classList.add("top");
  if (q.has("bg")) root.setProperty("--bg-a", q.get("bg"));
  if (q.has("scale")) root.setProperty("--scale", q.get("scale"));
  var safe = q.get("safe") !== "0";

  // 1920x1080 design units -> real pixels of the 16:9 frame
  function fit() {
    var w = $("frame").getBoundingClientRect().width || 1920;
    root.setProperty("--u", (w / 1920) + "px");
    root.setProperty("--side", safe ? 96 : 24);
    root.setProperty("--edge", safe ? 54 : 20);
  }
  window.addEventListener("resize", fit);
  fit();

  // ---------------------------------------------------------------- data
  var S = null, got = 0, okAt = 0, polling = false;
  function poll() {
    if (polling) return;
    polling = true;
    fetch(base + "/api/state", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.live) { S = j; got = performance.now(); okAt = got; }
      })
      .catch(function () {})
      .then(function () { polling = false; });
  }
  setInterval(poll, 120);
  poll();

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function hms(t) {
    t = Math.max(0, Math.floor(t));
    return pad(Math.floor(t / 3600)) + ":" + pad(Math.floor(t % 3600 / 60)) +
           ":" + pad(t % 60);
  }
  function short(t) {
    t = Math.round(Math.abs(t));
    if (t >= 3600) return Math.floor(t / 3600) + ":" +
                          pad(Math.floor(t % 3600 / 60)) + ":" + pad(t % 60);
    return pad(Math.floor(t / 60)) + ":" + pad(t % 60);
  }
  var last = {};
  function set(id, prop, val) {
    var k = id + "." + prop;
    if (last[k] === val) return;
    last[k] = val;
    var el = $(id);
    if (prop === "text") el.textContent = val;
    else if (prop === "color") el.style.color = val;
    else if (prop === "hide") el.classList.toggle("hide", val);
    else if (prop === "fs") el.style.setProperty("--fs", val);
  }

  // --------------------------------------------------------------- frame
  function frame() {
    requestAnimationFrame(frame);
    var now = performance.now();
    if (debug) {
      $("debug").style.display = "block";
      $("debug").textContent = S ? "DA Timer " + S.version + "  " +
          Math.round(now - okAt) + " ms since data" :
          "Waiting for DA Timer at " + (base || location.host);
    }
    var stale = !S || now - okAt > 3000;
    wrap.classList.toggle("hidden", stale);
    if (!S) return;
    var L = S.live, O = S.overlay || {}, dt = (now - got) / 1000;
    var seg = L.seg + (L.seg_running ? dt : 0);
    var prog = L.prog + (L.prog_running ? dt : 0);
    var items = {};
    (O.items || []).forEach(function (r) { items[r.id] = r; });
    function on(id, key) {
      if (forced) return forced.indexOf(key) >= 0;
      return !!(items[id] && items[id].show);
    }
    root.setProperty("--accent", O.accent || "#00e5f0");
    root.setProperty("--fg", O.fg || "#ffffff");
    var C = O.colours || { ok: "#2bd47d", warn: "#ffb547", over: "#ff4757" };

    // name block: title, "SEGMENT 3 OF 8 - 5 LEFT", segment name
    var showName = on("seg_title", "name");
    set("b-name", "hide", !showName);
    bar.classList.toggle("compact", !showName);
    set("title", "text", on("title", "title") ? O.title || "" : "");
    set("seg-cap", "text", O.seg_caption || "");
    set("seg-name", "text", O.seg_name || "");

    // segment clock + time left / over
    var goal = O.goal || 0, si = items.seg_time || {};
    var showSeg = on("seg_time", "seg");
    set("b-seg", "hide", !showSeg && !on("seg_status", "status"));
    set("seg", "hide", !showSeg);
    set("seg-clock-cap", "text", showName ? "Segment"
        : (O.seg_caption || "Segment"));
    var segTxt = hms(seg), segCol = si.colour || O.fg || "#fff";
    var over = false;
    if (si.count === "down" && goal) {
      var left = goal - Math.floor(seg);
      if (left >= 0) { segTxt = hms(left); if (left <= 15) segCol = C.warn; }
      else { segTxt = "+" + hms(-left); segCol = C.over; over = true; }
    }
    set("seg", "text", segTxt);
    set("seg", "color", segCol);
    set("seg", "fs", String(84 * Math.min(Math.max(si.size || 1, .6), 1.5)));
    var st = "", stCol = "";
    if (on("seg_status", "status") && goal) {
      var d = Math.floor(seg) - goal;
      if (d > 0) { st = "+" + short(d) + " over"; stCol = C.over; over = true; }
      else if (d === 0) { st = "On goal"; stCol = C.warn; }
      else { st = short(-d) + " left"; stCol = -d <= 15 ? C.warn : C.ok; }
      if (items.seg_status && items.seg_status.colour) {
        stCol = items.seg_status.colour;
      }
    }
    set("status", "text", st);
    set("status", "color", stCol);

    // program clock
    var pi = items.show_time || {};
    set("b-prog", "hide", !on("show_time", "prog"));
    set("prog-cap", "text", O.show_label || "Program");
    set("prog", "text", hms(prog));
    set("prog", "color", pi.colour || O.fg || "#fff");
    set("prog", "fs", String(84 * Math.min(Math.max(pi.size || 1, .6), 1.5)));

    // time of day / timecode
    var ti = items.clock || {};
    set("b-tod", "hide", !on("clock", "tod"));
    if (ti.mode === "tc" && L.tc) {
      set("tod-cap", "text", "Timecode");
      set("tod", "text", L.tc);
    } else {
      set("tod-cap", "text", "Time of day");
      set("tod", "text", hms((L.tod + dt) % 86400));
    }
    set("tod", "color", ti.colour || O.fg || "#fff");
    set("tod", "fs", String(84 * Math.min(Math.max(ti.size || 1, .6), 1.5)));

    // bottom message as a strip above the bar
    var msg = on("message", "msg") ? O.message || "" : "";
    set("msg", "text", msg);
    set("msg", "hide", !msg);

    bar.classList.toggle("running", !!L.seg_running && !over);
    bar.classList.toggle("over", over);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
