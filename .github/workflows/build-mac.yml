# Builds the Mac version of DA Timer on GitHub's Mac machines.
# Push this folder to a GitHub repo, then: Actions tab -> "Build Mac app"
# -> Run workflow. Download the zips from the finished run's "Artifacts".
name: "Test build: Mac"

on:
  workflow_dispatch:
  workflow_call:              # used by "Publish release"
    inputs:
      tag:
        type: string
        required: false
  push:
    tags: ["v*"]
  release:
    types: [published]       # publishing a release builds and attaches the apps

permissions:
  contents: write          # lets a version tag publish a release

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15          # Apple silicon (M1 and later)
            arch: apple-silicon
          - runner: macos-15-intel    # older Intel Macs
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          brew install hidapi
          cp "$(brew --prefix hidapi)/lib/libhidapi.dylib" ./libhidapi.dylib
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow openpyxl numpy sounddevice pyobjc-framework-Cocoa

      - name: Check tkinter works
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Build DA Timer.app
        run: pyinstaller --noconfirm mac/DA_Timer_mac.spec

      - name: Check the app starts
        run: |
          export APPDATA="$RUNNER_TEMP/datimer-test"
          "dist/DA Timer.app/Contents/MacOS/DA Timer" > "$RUNNER_TEMP/app.log" 2>&1 &
          PID=$!
          sleep 15
          cat "$RUNNER_TEMP/app.log"
          if kill -0 $PID 2>/dev/null; then
            echo "DA Timer is running - good"; kill $PID
          else
            echo "DA Timer quit or crashed on start"; exit 1
          fi
          ls -la "dist/DA Timer.app/Contents/Frameworks/libhidapi.dylib"

      - name: Zip it
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "DA Timer.app" "DA-Timer-mac-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: DA-Timer-mac-${{ matrix.arch }}
          path: dist/DA-Timer-mac-${{ matrix.arch }}.zip

      - name: Attach to the release
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "DA Timer $TAG" --notes-file RELEASE_NOTES.md || true
          gh release upload "$TAG" "dist/DA-Timer-mac-${{ matrix.arch }}.zip" --clobber
