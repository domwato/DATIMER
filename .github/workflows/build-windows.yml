# Builds DA_Timer.exe on GitHub's Windows machines.
# Actions tab -> "Test build: Windows" -> Run workflow, then download the zip
# from the finished run's "Artifacts".
name: "Test build: Windows"

on:
  workflow_dispatch:
  workflow_call:              # used by "Publish release"
    inputs:
      tag:
        type: string
        required: false
  push:
    tags: ["v*"]
  release:
    types: [published]       # publishing a release builds and attaches the apps

# Read-only by default. Actions are pinned to exact commits (update them
# deliberately, e.g. with Dependabot), Python packages to exact versions and
# hashes (requirements-build.txt).
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          architecture: x64          # hidapi.dll is 64-bit

      - name: Install build tools (pinned, hash-checked)
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Check hidapi.dll is the recorded build
        shell: pwsh
        run: |
          $want = (Select-String -Path THIRD-PARTY-LICENSES.txt -Pattern 'hidapi.dll SHA-256: ([0-9a-f]{64})').Matches[0].Groups[1].Value
          $have = (Get-FileHash hidapi.dll -Algorithm SHA256).Hash.ToLower()
          if ($have -ne $want) { Write-Error "hidapi.dll changed ($have)"; exit 1 }

      - name: Build DA_Timer.exe
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name DA_Timer \
            --icon stopwatch.ico --version-file version_info.txt \
            --add-data "stopwatch.ico;." --add-data "author_logo.png;." \
            --add-data "overlay.html;." \
            --add-data "fonts;fonts" --add-binary "hidapi.dll;." \
            --paths vendor --collect-submodules StreamDeck \
            --hidden-import da_deck --hidden-import da_sync \
            --hidden-import PIL.ImageTk --hidden-import PIL._tkinter_finder \
            --collect-all sounddevice \
            da_timer.py

      - name: Check the app starts
        shell: pwsh
        run: |
          $env:APPDATA = "$env:RUNNER_TEMP\datimer-test"
          $p = Start-Process -FilePath "dist\DA_Timer.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Write-Error "DA_Timer.exe quit or crashed on start (exit $($p.ExitCode))"; exit 1 }
          Write-Host "DA_Timer.exe is running - good"
          $o = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:47800/overlay"
          if ($o.Content -notmatch "DA Timer overlay") { Write-Error "overlay page missing"; exit 1 }
          $st = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:47800/api/state"
          if ($st.Content -notmatch '"live"') { Write-Error "live clock data missing"; exit 1 }
          $code = & curl.exe -s -o NUL -w "%{http_code}" -H "Host: evil.example:47800" http://127.0.0.1:47800/api/state
          if ($code -ne "403") { Write-Error "foreign Host header was not refused ($code)"; exit 1 }
          Write-Host "Overlay page and live data served, foreign Host refused - good"
          Stop-Process -Id $p.Id -Force

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist\DA_Timer.exe pkg\
          Copy-Item "DA Timer Help.pdf" pkg\
          Copy-Item "StreamDeck\DA Timer.streamDeckPlugin" pkg\
          Compress-Archive -Path pkg\* -DestinationPath DA-Timer-windows.zip
          $h = (Get-FileHash DA-Timer-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$h  DA-Timer-windows.zip" | Out-File -Encoding ascii -NoNewline DA-Timer-windows.zip.sha256
          Get-Content DA-Timer-windows.zip.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: DA-Timer-windows
          path: |
            DA-Timer-windows.zip
            DA-Timer-windows.zip.sha256

  # Only this small job can write to the repo: it attaches the finished
  # zips (with checksums and a signed build attestation) to the release.
  attach:
    needs: build
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # upload release assets
      id-token: write          # sign the build attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with:
          pattern: DA-Timer-windows
          merge-multiple: true
          path: out

      - name: Attest the build (users can check it with "gh attestation verify")
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-path: out/*.zip

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$REPO" --title "DA Timer $TAG" --generate-notes || true
          gh release upload "$TAG" --repo "$REPO" out/*.zip out/*.sha256 --clobber
